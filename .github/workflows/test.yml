name: Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  vim9-tests:
    name: Vim9 Test Suite
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Vim 9.1+ and ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y vim ripgrep
          vim --version | head -n 5
          rg --version

      - name: Run Vim9 tests
        run: ./test/run.sh
