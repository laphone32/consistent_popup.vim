name: Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  vim9-tests:
    name: Vim9 Test Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A hung Vim must not burn hours of CI time (run.sh also has its own timeout)
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04 # Vim 9.1.0016: oldest supported, exercises the fallbacks
          - ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Vim and ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y vim ripgrep
          vim --version | head -n 5
          rg --version

      - name: Run Vim9 tests
        run: ./test/run.sh

      - name: Check plugin startup
        run: ./test/check_startup.sh

  vim-too-old:
    name: Version guard (Vim 9.0, Debian bookworm)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container: debian:bookworm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Vim
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y vim
          vim --version | head -n 2

      - name: Expect one warning and no errors
        run: ./test/check_startup.sh --expect-guard
